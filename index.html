<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Scan</title>
<script src="html5-qrcode.min.js"></script>
<style>
:root{--bg:#f2f4f0;--card:#fff;--ink:#14231f;--mut:#667570;--line:#d5dbd6;--in:#0f766e;--out:#c2410c;--acc:var(--in);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101816;--card:#18221f;--ink:#e8efec;--mut:#8fa09a;--line:#2b3834;--in:#2dd4bf;--out:#fb923c}}
:root[data-theme="dark"]{--bg:#101816;--card:#18221f;--ink:#e8efec;--mut:#8fa09a;--line:#2b3834;--in:#2dd4bf;--out:#fb923c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding-bottom:90px}
body[data-m=out]{--acc:var(--out)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding:10px;background:var(--bg)}
nav button{flex:1;padding:12px 4px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;border-radius:10px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#scan{margin:0 10px 10px;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:10px}
#reader{width:100%;min-height:0;border-radius:8px;overflow:hidden;background:#000}
#reader:empty{display:none}
.row{display:flex;gap:8px;margin-top:8px}
input,select{flex:1;min-width:0;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700}
.btn.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
#view{padding:0 10px}
.big{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border-left:8px solid var(--acc)}
.big b{display:block;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--mut)}
h3{margin:18px 2px 6px;font-size:15px;display:flex;justify-content:space-between}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.it .n{flex:1;min-width:0}.it .n small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.q{font-weight:800;font-size:20px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.sm{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 20px/1 inherit}
.empty{color:var(--mut);padding:14px 4px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);max-width:560px;margin:0 auto;display:none}
#bar .btn{width:100%;padding:16px;font-size:18px}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
#sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#sheet p{margin:0 0 8px;color:var(--mut);word-break:break-all}
#sheet input{width:100%;margin-bottom:8px;flex:none}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:10;display:none;max-width:90%;text-align:center}
#toast.bad{background:#b91c1c;color:#fff}
</style></head><body data-m="in">
<nav><button data-t="in" class="on">Entrada</button><button data-t="out">Venda</button><button data-t="stock">Stock</button></nav>
<section id="scan">
  <div id="reader"></div>
  <div class="row"><button class="btn" id="cam">Ligar câmara</button><button class="btn g" id="pic">Tirar foto</button></div>
  <input type="file" id="fi" accept="image/*" capture="environment" hidden>
  <div id="reader-tmp" style="display:none"></div>
  <div class="row"><input id="man" placeholder="Ou escreve o código" inputmode="numeric"><button class="btn g" id="manb">OK</button></div>
</section>
<main id="view"></main>
<div id="bar"><button class="btn" id="sell">Confirmar venda</button></div>
<div id="sheet"><div>
  <b>Produto novo</b><p id="shc"></p>
  <input id="sn" placeholder="Nome (ex: Gin Beefeater 750ml)">
  <input id="sc" list="cl" placeholder="Categoria (ex: Gin)"><datalist id="cl"></datalist>
  <div class="row"><button class="btn g" id="sx">Cancelar</button><button class="btn" id="so" style="flex:1">Guardar e +1</button></div>
</div></div>
<input type="file" id="impf" accept="application/json,.json" hidden>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let S={p:{}},tab='in',cat='',cart={},qr=null,running=false,pending=null,last='',lastT=0;
try{S=JSON.parse(localStorage.getItem('stk')||'{"p":{}}')}catch(e){}
const save=()=>{try{localStorage.setItem('stk',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cats=()=>[...new Set(Object.values(S.p).map(x=>x.c))].sort((a,b)=>a.localeCompare(b));
const tot=c=>Object.values(S.p).filter(x=>x.c===c).reduce((a,x)=>a+x.q,0);
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',bad?5000:1800)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},90)}catch(e){}try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}

async function camToggle(){
  if(running){await qr.stop();running=false;$('#reader').innerHTML='';}
  else{
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoMedia'};
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      st.getTracks().forEach(t=>t.stop());
      let cam={facingMode:'environment'};
      try{const cs=await Html5Qrcode.getCameras();const bk=cs.find(c=>/back|rear|traseira|environment/i.test(c.label))||cs[cs.length-1];if(bk)cam=bk.id}catch(x){}
      qr=qr||new Html5Qrcode('reader',{useBarCodeDetectorIfSupported:true});
      const cfg={fps:10,qrbox:{width:250,height:150}};
      try{await qr.start(cam,cfg,onScan,()=>{})}catch(x){await qr.start({facingMode:'environment'},cfg,onScan,()=>{})}
      running=true;
    }catch(e){
      const n=(e&&e.name)||'',m=String((e&&e.message)||e||'');
      toast(n==='NoMedia'||!window.isSecureContext?'Este navegador/ecrã não deixa usar a câmera. Abre o link no Chrome ou usa "Tirar foto".'
        :n==='NotAllowedError'||/denied|permission/i.test(m)?'Câmera bloqueada. Permite nas definições do site, ou abre no Chrome (fora do Claude).'
        :n==='NotFoundError'?'Nenhuma câmera encontrada.'
        :n==='NotReadableError'?'Câmera em uso por outra app. Fecha-a e tenta de novo.'
        :'Erro da câmera: '+(n||m.slice(0,60)),1);
    }
  }
  $('#cam').textContent=running?'Desligar câmara':'Ligar câmara';
}
function onScan(code){const n=Date.now();if(pending||(code===last&&n-lastT<1200))return;last=code;lastT=n;beep();handle(code)}
function handle(code){
  code=String(code).trim();if(!code)return;
  const p=S.p[code];
  if(tab==='in'){
    if(p){p.q++;save();toast(p.n+'  +1 → '+p.q);render()}
    else{pending=code;$('#shc').textContent='Código: '+code;$('#sn').value='';$('#sc').value=cat;
      $('#cl').innerHTML=cats().map(c=>'<option value="'+esc(c)+'">').join('');$('#sheet').style.display='flex';setTimeout(()=>$('#sn').focus(),50)}
  }else if(tab==='out'){
    if(!p)return toast('Código não registado: '+code,1);
    cart[code]=(cart[code]||0)+1;toast(p.n+'  ×'+cart[code]);render()
  }
}
function closeSheet(){pending=null;$('#sheet').style.display='none'}
$('#sx').onclick=closeSheet;
$('#so').onclick=()=>{
  const n=$('#sn').value.trim(),c=$('#sc').value.trim();
  if(!n||!c)return toast('Preenche nome e categoria',1);
  S.p[pending]={n,c,q:1};cat=c;save();closeSheet();toast(n+' registado → 1');render()
};
$('#manb').onclick=()=>{handle($('#man').value);$('#man').value=''};
$('#man').onkeydown=e=>{if(e.key==='Enter')$('#manb').click()};
$('#cam').onclick=camToggle;
$('#pic').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const q=new Html5Qrcode('reader-tmp',{useBarCodeDetectorIfSupported:true});const r=await q.scanFile(f,false);try{q.clear()}catch(x){}beep();handle(r)}
  catch(err){toast('Não li o código. Tenta mais perto e com luz.',1)}
};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
async function exportar(){
  const name='stock-backup-'+new Date().toISOString().slice(0,10)+'.json',txt=JSON.stringify(S),P=window.Capacitor&&Capacitor.Plugins;
  try{
    if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:'Backup do stock',url:r.uri})}
    else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));l.download=name;l.click()}
    toast('Backup pronto')
  }catch(e){toast('Não consegui exportar',1)}
}
const DATA='<h3><span>Dados</span></h3><div class="row" style="flex-wrap:wrap"><button class="btn g" data-a="exp">Exportar backup</button><button class="btn g" data-a="imp">Importar</button><button class="btn g" data-a="wipe" style="color:#b91c1c;border-color:#b91c1c">Apagar tudo</button></div>';
$('#impf').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.p!=='object')throw 0;
    if(confirm('Importar vai substituir o stock atual. Continuar?')){S={p:d.p};save();toast('Backup importado ✓');render()}}
    catch(x){toast('Ficheiro inválido',1)}};r.readAsText(f)
};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.body.dataset.m=tab;$('#scan').style.display=tab==='stock'?'none':'block';
  if(tab==='stock'&&running)camToggle();render()
});

function item(c,p,right){return '<div class="it"><div class="n">'+esc(p.n)+'<small>'+esc(c)+'</small></div>'+right+'</div>'}
function ctl(c,d,q,a){return '<button class="sm" data-a="'+a+'" data-c="'+esc(c)+'" data-d="-1">−</button><span class="q">'+q+'</span><button class="sm" data-a="'+a+'" data-c="'+esc(c)+'" data-d="1">+</button>'}

function render(){
  const v=$('#view'),bar=$('#bar');bar.style.display='none';
  if(tab==='in'){
    const list=Object.entries(S.p).filter(([,p])=>p.c===cat);
    v.innerHTML='<div class="row" style="margin:0 0 10px"><input id="ci" list="cl2" placeholder="Categoria atual (ex: Gin)" value="'+esc(cat)+'"><datalist id="cl2">'+cats().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></div>'
    +(cat?'<div class="big"><span>Total em '+esc(cat)+'</span><b>'+tot(cat)+'</b></div>':'')
    +(list.length?list.map(([c,p])=>item(c,p,'<span class="q">'+p.q+'</span>')).join(''):'<div class="empty">'+(cat?'Nada nesta categoria ainda. Scaneia um produto.':'Escolhe a categoria e começa a scanear. Produto novo? A app pergunta o nome.')+'</div>');
    $('#ci').onchange=e=>{cat=e.target.value.trim();render()};
  }else if(tab==='out'){
    const e=Object.entries(cart);
    const all=Object.entries(S.p).sort((a,b)=>a[1].n.localeCompare(b[1].n));
    v.innerHTML='<div class="row" style="margin:0 0 10px"><select id="ms"><option value="">Escolher produto à mão…</option>'+all.map(([c,p])=>'<option value="'+esc(c)+'">'+esc(p.n)+' ('+p.q+')</option>').join('')+'</select><button class="btn g" data-a="madd">Add</button></div>'
    +(e.length?e.map(([c,n])=>item(S.p[c].c,S.p[c],ctl(c,0,n,'cadj')+'')).join('')+'<button class="btn g" data-a="clr" style="width:100%;margin-top:6px">Limpar lista</button>'
      :'<div class="empty">Scaneia os produtos a vender. Cada leitura soma 1 à lista; só sai do stock quando confirmares.</div>');
    if(e.length){bar.style.display='block';$('#sell').textContent='Confirmar venda ('+e.reduce((a,[,n])=>a+n,0)+')'}
  }else{
    const cs=cats();
    v.innerHTML=(cs.length?cs.map(c=>'<h3><span>'+esc(c)+'</span><span>'+tot(c)+'</span></h3>'+Object.entries(S.p).filter(([,p])=>p.c===c).map(([k,p])=>item(k,p,ctl(k,0,p.q,'adj')+'<button class="sm" data-a="del" data-c="'+esc(k)+'" style="border-color:transparent">✕</button>')).join('')).join('')
      :'<div class="empty">Stock vazio. Vai a Entrada e scaneia os produtos.</div>')+DATA;
  }
}
$('#view').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,c=b.dataset.c,d=+b.dataset.d;
  if(a==='adj'){S.p[c].q=Math.max(0,S.p[c].q+d);save()}
  else if(a==='del'){if(confirm('Apagar '+S.p[c].n+'?')){delete S.p[c];save()}}
  else if(a==='cadj'){cart[c]=(cart[c]||0)+d;if(cart[c]<=0)delete cart[c]}
  else if(a==='clr')cart={};
  else if(a==='exp'){exportar();return}
  else if(a==='imp'){$('#impf').click();return}
  else if(a==='wipe'){if(confirm('Apagar TODOS os produtos e quantidades? Não dá para desfazer.')){S={p:{}};cart={};try{localStorage.removeItem('stk')}catch(x){}toast('Tudo apagado')}}
  else if(a==='madd'){const k=$('#ms').value;if(k)cart[k]=(cart[k]||0)+1}
  render()
};
$('#sell').onclick=()=>{
  const e=Object.entries(cart),bad=e.filter(([c,n])=>S.p[c].q<n);
  if(bad.length)return toast('Stock insuficiente: '+bad.map(([c])=>S.p[c].n).join(', '),1);
  e.forEach(([c,n])=>S.p[c].q-=n);save();cart={};toast('Venda registada ✓');render()
};
render();
</script></body></html>
