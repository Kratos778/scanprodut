name: Build APK (Release assinado)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Copiar biblioteca do leitor (offline)
        run: |
          mkdir -p www
          cp node_modules/html5-qrcode/html5-qrcode.min.js www/
          # garantir que index.html está em www/
          if [ -f index.html ] && [ ! -f www/index.html ]; then
            mv index.html www/
          fi

      - name: Criar projecto Android
        run: npx cap add android

      - name: Permissão da câmara + features
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # adicionar CAMERA se ainda não existir
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />#' "$MANIFEST"
          fi
          grep -n "CAMERA\|camera" "$MANIFEST" || true

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar assinatura (keystore fixa)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Activar signing no build.gradle
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          GRADLE=android/app/build.gradle
          # injectar signingConfigs se ainda não existir
          if ! grep -q 'signingConfigs' "$GRADLE"; then
            sed -i '/android {/a\    signingConfigs {\n        release {\n            def keystorePropertiesFile = rootProject.file("key.properties")\n            def keystoreProperties = new Properties()\n            if (keystorePropertiesFile.exists()) {\n                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n            }\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n        }\n    }' "$GRADLE"
          fi
          # forçar release a usar o signingConfig
          if ! grep -q 'signingConfig signingConfigs.release' "$GRADLE"; then
            sed -i '/buildTypes {/,/release {/ s/release {/release {\n            signingConfig signingConfigs.release/' "$GRADLE"
          fi

      - name: Gerar APK Release (assinado)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Gerar APK Debug (fallback se não houver keystore)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-scan-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
