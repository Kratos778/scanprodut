name: Build APK (Release assinado)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Copiar biblioteca do leitor (offline)
        run: |
          mkdir -p www
          cp node_modules/html5-qrcode/html5-qrcode.min.js www/
          if [ -f index.html ] && [ ! -f www/index.html ]; then
            mv index.html www/
          fi

      - name: Criar projecto Android
        run: npx cap add android

      - name: Permissão da câmara + features
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />#' "$MANIFEST"
          fi
          grep -n "CAMERA\|camera" "$MANIFEST" || true

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar keystore (se existir) e gerar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "=== Keystore encontrada → a gerar APK RELEASE assinado ==="
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

            cat > key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

            # inject signingConfigs no build.gradle se ainda não existir
            GRADLE=app/build.gradle
            if ! grep -q 'signingConfigs' "$GRADLE"; then
              # inserir depois de "android {"
              python3 - << 'PY'
import re
with open("app/build.gradle") as f:
    s = f.read()
block = '''
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("key.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            storeFile file(keystoreProperties["storeFile"])
            storePassword keystoreProperties["storePassword"]
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
        }
    }
'''
s = s.replace("android {", "android {" + block, 1)
# forçar signingConfig no release
if "signingConfig signingConfigs.release" not in s:
    s = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
with open("app/build.gradle", "w") as f:
    f.write(s)
print("signingConfigs injectado")
PY
            fi

            ./gradlew assembleRelease
            echo "APK release gerado"
            ls -la app/build/outputs/apk/release/ || true
          else
            echo "=== Sem keystore nos Secrets → a gerar APK DEBUG ==="
            ./gradlew assembleDebug
            echo "APK debug gerado"
            ls -la app/build/outputs/apk/debug/ || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-scan-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
